services:
  db:
    image: mysql:8.0
    container_name: smartparcel-mysql
    restart: always
    environment:
      MYSQL_DATABASE: smartparcel
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smartparcel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartparcel-backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/smartparcel?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartparcel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartparcel-frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    networks:
      - smartparcel-net

volumes:
  mysql-data:

networks:
  smartparcel-net:
    driver: bridge

